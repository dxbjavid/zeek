version: 2.1

orbs:
  win: circleci/windows@5.1.1
  docker: circleci/docker@3.0.1

jobs:
  # Fetches the zeek-testing test traces either from a cache or the remote host
  # and presents them in a workspace for other build jobs to use. This saves
  # other jobs from having to download them.
  fetch-test-traces:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - restore_cache:
          keys:
            - zeek-traces-v2
      - run:
          name: Initializing external testing repos
          command: ci/init-external-repos.sh
      - save_cache:
          key: zeek-traces-v2
          paths:
            - testing/external/zeek-testing-traces
      - persist_to_workspace:
          root: .
          paths:
            - testing/external/zeek-testing-traces

  create-build-image:
    parameters:
      build_arm:
        type: boolean
        default: false
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      # TODO: this whole thing could probably move into a script in the ci directory
      # TODO: Add a step to flush old images out of the cache. Maybe loop through what's
      # available for each image name and keep the last three versions?
      - checkout
      - run:
          name: Set extra environment variables
          command: |
            set +e
            if << parameters.build_arm >>; then
              echo "export PLATFORMS='linux/amd64,linux/arm64'" >> "$BASH_ENV"
            else
              echo "export PLATFORMS='linux/amd64'" >> "$BASH_ENV"
            fi

            IMAGE_NAME=$(echo $CIRCLE_JOB | cut -d- -f 3-)
            DOCKERFILE_PATH=ci/$IMAGE_NAME/Dockerfile
            IMAGE_VERSION=$(awk -F= '/DOCKERFILE_VERSION/ {print $2}' $DOCKERFILE_PATH)

            echo "export IMAGE_NAME=$IMAGE_NAME" >> "$BASH_ENV"
            echo "export DOCKERFILE_PATH=$DOCKERFILE_PATH" >> "$BASH_ENV"
            echo "export IMAGE_VERSION=$IMAGE_VERSION" >> "$BASH_ENV"
            echo "export FULL_IMAGE_TAG=zeek/zeek-ci:$IMAGE_NAME-$IMAGE_VERSION" >> "$BASH_ENV"
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Set up Docker Buildx
          command: |
            docker buildx create --use --name multiarch-builder --driver docker-container
            docker buildx inspect --bootstrap
      - run:
          name: Log in to Docker Hub
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin
      - run:
          name: Check if image exists remotely
          command: |
            set +e
            if << parameters.build_arm >>; then
               NUM_LINES=$(docker manifest inspect $FULL_IMAGE_TAG 2>/dev/null | grep -c -E "amd64|arm64")
               if [ $NUM_LINES -eq 2 ]; then
                 echo "Both amd64 and arm64 images already exist for $FULL_IMAGE_TAG, exiting"
                 circleci-agent step halt
               else
                 echo "Either amd64 or arm64 images are missing from $FULL_IMAGE_TAG, continuing with build"
               fi
            else
               NUM_LINES=$(docker manifest inspect $FULL_IMAGE_TAG 2>/dev/null | grep -c -E "amd64")
               if [ $NUM_LINES -eq 1 ]; then
                 echo "$FULL_IMAGE_TAG already exists, exiting"
                 circleci-agent step halt
               else
                 echo "$FULL_IMAGE_TAG is missing, continuing with build"
               fi
            fi
      - run:
          name: Build and push multi-arch image
          command: |
            docker buildx build \
              --platform $PLATFORMS \
              --file $DOCKERFILE_PATH \
              --tag $FULL_IMAGE_TAG \
              --push \
              .

  linux-build:
    parameters:
      docker_image:
        type: string
      resource_class:
        type: string
        default: large
      configure_flags:
        type: string
        default: --build-type=release --disable-broker-tests --prefix=${ZEEK_CI_WORKING_DIR}/install --ccache --enable-werror
      extra_env:
        type: string
        default: ""
      enable_tests:
        type: boolean
        default: true
      enable_benchmarks:
        # TODO: create the benchmarker steps
        type: boolean
        default: false
      install_spicy_analyzers:
        type: boolean
        default: false
    environment:
      ZEEK_CI: 1
      ZEEK_CI_CONFIGURE_FLAGS: << parameters.configure_flags >>
      ZEEK_CI_CPUS: 4
      ZEEK_CI_BTEST_JOBS: 4
      ZEEK_CI_BTEST_RETRIES: 2
      ZEEK_CI_RUNNER_OS: linux
      ZEEK_TEST_ULIMIT_OPEN_FILES: 256
      ZEEK_CIRCLE_EXTRA_ENV: << parameters.extra_env >>
      ZEEK_CI_CREATE_ARTIFACT: << parameters.enable_benchmarks >>
    docker:
      - image: << parameters.docker_image >>
        auth:
          username: $DOCKER_LOGIN
          password: $DOCKER_PASSWORD
    resource_class: << parameters.resource_class >>
    steps:
      - run:
          name: Set extra environment variables
          command: |
            echo "export ZEEK_CI_WORKING_DIR=${CIRCLE_WORKING_DIRECTORY}" >> "$BASH_ENV"
            IFS=$'\n'
            for line in ${ZEEK_CIRCLE_EXTRA_ENV}; do
              echo "export ${line}" >> "$BASH_ENV"
            done
      - checkout
      - run:
          name: Update submodules
          command: git submodule update --recursive --init
      - restore_cache:
          keys:
            - v2-ccache-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-{{ .Branch }}-{{ .Revision }}-
            - v2-ccache-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-{{ .Branch }}-
            - v2-ccache-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-
      - attach_workspace:
          at: .
      - run:
          name: Initialize external testing repos
          command: ci/init-external-repos.sh
      - run:
          name: Setup ccache
          command: |
            set +e
            mkdir -p ~/.ccache
            ccache --set-config=max_size=2G
            ccache --set-config=compression=true
            ccache --zero-stats
            ccache --show-stats
      - run:
          name: Build
          command: ci/build.sh
          environment:
      - run:
          name: Show ccache statistics
          command: ccache --show-stats
      - save_cache:
          key: v2-ccache-{{ .Environment.CIRCLE_JOB }}-{{ arch }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.ccache
      - when:
          condition: << parameters.enable_tests >>
          steps:
            - run:
                name: Test
                command: ci/test.sh
            - store_test_results:
                path: btest-results
      - when:
          condition: << parameters.install_spicy_analyzers >>
          steps:
            - run:
                name: Install spicy analyzers
                command: ci/spicy-install-analyzers.sh
      - when:
          condition: << parameters.enable_benchmarks >>
          steps:
            - store_artifacts:
                path: build.tgz
                destination: build
            - run:
                name: Run benchmarks
                command: ci/benchmark.sh

  windows-build:
    environment:
      ZEEK_CI: 1
      ZEEK_CI_CPUS: 4
      ZEEK_CI_BTEST_JOBS: 2
      ZEEK_CI_BTEST_RETRIES: 2
      ZEEK_CI_RUNNER_OS: windows
      ZEEK_CI_SKIP_EXTERNAL_BTESTS: 1
    executor:
      name: win/server-2022
      size: large
    steps:
      - run:
          name: Install Chocolatey dependencies
          command: |
            choco install -y --no-progress sed
            choco install -y --no-progress winflexbison3
            choco install -y --no-progress ccache
            choco install -y --no-progress ninja
      - run:
          name: Enable git symlinks
          command: git config --global core.symlinks true
      - checkout:
          # For some reason the default working path has stuff in it already so it can't clone into
          # that. Unfortunately that means we have to change the working directory for every other
          # command.
          path: zeek
      - run:
          name: Update submodules
          command: git submodule update --recursive --init
          working_directory: zeek
      - run:
          name: Dump environment info
          command: ci\windows\prepare.cmd
          shell: cmd.exe
          working_directory: zeek
      - restore_cache:
          name: Restore ccache
          keys:
            - v2-ccache-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
            - v2-ccache-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-
            - v2-ccache-{{ .Environment.CIRCLE_JOB }}-
      - restore_cache:
          name: Restore vcpkg cache
          keys:
            - vcpkg-{{ .Branch }}-{{ .Revision }}
            - vcpkg-{{ .Branch }}-
            - vcpkg-
      - run:
          name: Setup ccache
          command: |
            mkdir C:\tmp\zeek-ccache
            ccache --set-config=max_size=2G
            ccache --set-config=compression=true
            ccache --set-config=cache_dir=C:\tmp\zeek-ccache
            ccache --zero-stats
            ccache --show-stats
      - run:
          name: Configure
          command: ci\windows\configure.cmd
          working_directory: zeek
      - save_cache:
          name: Saving vcpkg build cache
          key: vcpkg-{{ .Branch }}-{{ .Revision }}
          paths:
            - zeek\auxil\vcpkg\installed
            - zeek\auxil\vcpkg\packages
            - zeek\auxil\vcpkg\downloads
      - run:
          name: Build
          command: ci\windows\build.cmd
          working_directory: zeek
      - save_cache:
          key: v2-ccache-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - C:\tmp\zeek-ccache
      - run:
          name: Test
          command: ci/windows/test.cmd
          working_directory: zeek

  macos-build:
    parameters:
      configure:
        type: string
        default: --build-type=release --disable-broker-tests --prefix=$CIRRUS_WORKING_DIR/install --ccache --enable-werror --with-krb5=/opt/homebrew/opt/krb5 -D NODEJS_ROOT_DIR=/opt/homebrew/opt/node@24
    environment:
      ZEEK_CI: 1
      ZEEK_CI_CONFIGURE_FLAGS: << parameters.configure >>
      # This is based on the size of the m4pro.medium runner, as specified in Circle's docs at
      # https://circleci.com/docs/guides/execution-managed/using-macos/#available-resource-classes.
      ZEEK_CI_CPUS: 6
      ZEEK_CI_BTEST_JOBS: 6
      ZEEK_CI_BTEST_RETRIES: 2
      ZEEK_CI_RUNNER_OS: macos
    macos:
      # TODO: should this be a parameter? Do we care to test on other Xcode versions other than the
      # latest? See https://circleci.com/docs/guides/execution-managed/using-macos/#supported-xcode-versions-silicon
      # for other options.
      xcode: 26.5.0
    resource_class: m4pro.medium
    steps:
      - run:
          name: Set extra environment variables
          command: |
            echo "export ZEEK_CI_WORKING_DIR=${CIRCLE_WORKING_DIRECTORY}" >> "$BASH_ENV"
      - checkout
      - run:
          name: Install dependencies
          command: ci/macos/prepare.sh
      - run:
          name: Update submodules
          command: git submodule update --recursive --init
      - restore_cache:
          name: Restore ccache directory
          keys:
            - v2-ccache-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
            - v2-ccache-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-
            - v2-ccache-{{ .Environment.CIRCLE_JOB }}-
      - attach_workspace:
          at: .
      - run:
          name: Initialize external testing repos
          command: ci/init-external-repos.sh
      - run:
          name: Setup ccache
          command: |
            set +e
            mkdir -p ~/.ccache
            ccache --set-config=max_size=2G
            ccache --set-config=compression=true
            ccache --zero-stats
            ccache --show-stats
      - run:
          name: Build
          command: ci/build.sh
          environment:
      - run:
          name: Show ccache statistics
          command: ccache --show-stats
      - save_cache:
          name: Save ccache directory
          key: v2-ccache-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.ccache
      - run:
          name: Test
          command: ci/test.sh
      - store_test_results:
          name: Store btest results
          path: btest-results

workflows:
  image-build-testing:
    when:
      equal: [ "circleci-project-setup-disabled", << pipeline.git.branch >> ]
    jobs:
      # - fetch-test-traces
      # - create-build-image:
      #     name: ubuntu-24.04-image
      #     image_name: ubuntu-24.04
      #     dockerfile_path: ci/ubuntu-24.04
      - create-build-image:
          name: build-image-ubuntu-26.04
          build_arm: false
      # - create-build-image:
      #     name: debian-13-image
      #     image_name: debian-13
      #     dockerfile_path: ci/debian-13
      # - linux-build:
      #     name: ubuntu-24.04
      #     docker_image: zeek/zeek-ci:ubuntu-24.04-20251125
      #     requires: [fetch-test-traces, ubuntu-24.04-image]
      #     enable_benchmarks: true

  circleci-config-testing:
    when:
      equal: [ "circleci-project-setup", << pipeline.git.branch >> ]
    jobs:
      - fetch-test-traces

      # The job name is split up and used to map to the Dockerfile and final image
      # name. Everything after "build-image-" should map to a directory in the ci
      # directory in the repo.
      - create-build-image:
          name: build-image-alpine
      - create-build-image:
          name: build-image-centos-stream-9
      - create-build-image:
          name: build-image-centos-stream-10
      - create-build-image:
          name: build-image-debian-12
      - create-build-image:
          name: build-image-debian-13
          build_arm: true
      - create-build-image:
          name: build-image-fedora-43
      - create-build-image:
          name: build-image-fedora-44
      - create-build-image:
          name: build-image-opensuse-leap-16.0
      - create-build-image:
          name: build-image-opensuse-tumbleweed
      - create-build-image:
          name: build-image-ubuntu-22.04
      - create-build-image:
          name: build-image-ubuntu-24.04
      - create-build-image:
          name: build-image-ubuntu-26.04

      - macos-build:
          name: macOS-xcode-26.5
          requires: [fetch-test-traces]
      - macos-build:
          name: macOS-xcode-16.4
          requires: [fetch-test-traces]
      - linux-build:
          name: alpine
          docker_image: zeek/zeek-ci:alpine-20260515
          requires: [fetch-test-traces, build-image-alpine]
      - linux-build:
          name: centos-stream-9
          docker_image: zeek/zeek-ci:centos-stream-9-20260515
          requires: [fetch-test-traces, build-image-centos-stream-9]
      - linux-build:
          name: centos-stream-10
          docker_image: zeek/zeek-ci:centos-stream-10-20260515
          requires: [fetch-test-traces, build-image-centos-stream-10]
      - linux-build:
          name: debian-12
          docker_image: zeek/zeek-ci:debian-12-20260515
          requires: [fetch-test-traces, build-image-debian-12]
      - linux-build:
          name: debian-13
          docker_image: zeek/zeek-ci:debian-13-20260515
          requires: [fetch-test-traces, build-image-debian-13]
      - linux-build:
          name: debian-13-arm
          docker_image: zeek/zeek-ci:debian-13-20260515
          resource_class: arm.large
          requires: [fetch-test-traces, build-image-debian-13]
      - linux-build:
          name: debian-13-binary
          docker_image: zeek/zeek-ci:debian-13-20260515
          configure_flags:  --prefix=$CIRRUS_WORKING_DIR/install --libdir=$CIRRUS_WORKING_DIR/install/lib --binary-package --enable-static-broker --enable-static-binpac --disable-broker-tests --build-type=Release --ccache --enable-werror
          requires: [fetch-test-traces, build-image-debian-13]
      - linux-build:
          name: debian-13-static
          docker_image: zeek/zeek-ci:debian-13-20260515
          configure_flags: --build-type=release --disable-broker-tests --enable-static-broker --enable-static-binpac --prefix=${WORKING_DIR}/install --ccache --enable-werror
          requires: [fetch-test-traces, build-image-debian-13]
      - linux-build:
          name: fedora-43
          docker_image: zeek/zeek-ci:fedora-43-20260515
          requires: [fetch-test-traces, build-image-fedora-43]
      - linux-build:
          name: fedora-44
          docker_image: zeek/zeek-ci:fedora-44-20260515
          configure_flags:  --prefix=$CIRRUS_WORKING_DIR/install --libdir=$CIRRUS_WORKING_DIR/install/lib --binary-package --enable-static-broker --enable-static-binpac --disable-broker-tests --build-type=Release --ccache --enable-werror
          requires: [fetch-test-traces, build-image-fedora-44]
      - linux-build:
          name: opensuse-leap-16.0
          docker_image: zeek/zeek-ci:opensuse-leap-16.0-20260515
          requires: [fetch-test-traces, build-image-opensuse-leap-16.0]
      - linux-build:
          name: opensuse-tumbleweed
          docker_image: zeek/zeek-ci:opensuse-tumbleweed-20260515
          requires: [fetch-test-traces, build-image-opensuse-tumbleweed]
      - linux-build:
          name: ubuntu-22.04
          docker_image: zeek/zeek-ci:ubuntu-22.04-20260515
          requires: [fetch-test-traces, build-image-ubuntu-22.04]
      - linux-build:
          name: ubuntu-24.04
          docker_image: zeek/zeek-ci:ubuntu-24.04-20260515
          requires: [fetch-test-traces, build-image-ubuntu-24.04]
          enable_benchmarks: true
      - linux-build:
          name: ubuntu-24.04-clang-libcpp
          docker_image: zeek/zeek-ci:ubuntu-24.04-20260515
          requires: [fetch-test-traces, build-image-ubuntu-24.04]
          extra_env: |
            CC="clang-19"
            CXX="clang++-19"
            CXXFLAGS="-stdlib=libc++"
            ZEEK_CI_CONFIGURE_FLAGS_EXTRA="--disable-javascript"
      - linux-build:
          name: ubuntu-24.04-clang-tidy
          docker_image: zeek/zeek-ci:ubuntu-24.04-20260515
          configure_flags: --build-type=debug --disable-broker-tests --prefix=$CIRRUS_WORKING_DIR/install --ccache --enable-werror --enable-clang-tidy
          requires: [fetch-test-traces, build-image-ubuntu-24.04]
          extra_env: |
            CC="clang-19"
            CXX="clang++-19"
          enable_tests: false
      - linux-build:
          name: ubuntu-24.04-spicy
          docker_image: zeek/zeek-ci:ubuntu-24.04-20260515
          configure_flags: --build-type=release --disable-broker-tests --enable-spicy-ssl --prefix=$CIRRUS_WORKING_DIR/install --ccache --enable-werror
          requires: [fetch-test-traces, build-image-ubuntu-24.04]
          extra_env: |
            ZEEK_CI_PREBUILD_COMMAND="cd auxil/spicy && git fetch && git reset --hard origin/main && git submodule update --init --recursive"
          install_spicy_analyzers: true
          enable_benchmarks: true
      - linux-build:
          name: ubuntu-24.04-spicy-head
          docker_image: zeek/zeek-ci:ubuntu-24.04-20260515
          requires: [fetch-test-traces, build-image-ubuntu-24.04]
          install_spicy_analyzers: true
          enable_benchmarks: true
      - linux-build:
          name: ubuntu-24.04-zam
          docker_image: zeek/zeek-ci:ubuntu-24.04-20260515
          requires: [fetch-test-traces, build-image-ubuntu-24.04]
          extra_env: |
            ZEEK_CI_SKIP_UNIT_TESTS=1
            ZEEK_CI_SKIP_EXTERNAL_BTESTS=1
            ZEEK_CI_BTEST_EXTRA_ARGS="-a zam"
            ZEEK_CI_BTEST_JOBS=3
      - linux-build:
          name: ubuntu-26.04
          docker_image: zeek/zeek-ci:ubuntu-26.04-20260515
          requires: [fetch-test-traces, build-image-ubuntu-26.04]
      - windows-build
